name: Public Tree Scan

# Deliberately has no paths filter. Lint runs with paths-ignore for "**/*.md"
# and "docs/**", which is right for a code linter and wrong for this: internal
# hostnames reach a repository through prose far more often than through code,
# and documentation held the large majority of the 1122 endpoint occurrences
# this guard was written against. Every file has to be in scope, including
# dotfiles, which is why the scan passes --hidden.
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'

# Least privilege for the default GITHUB_TOKEN. Registry pushes authenticate
# with their own credentials, not this token, so read access to the checkout is
# all any job here needs.
permissions:
  contents: read

# One run per pull request or feature branch: a new head cancels the previous
# one. Pushes to main and deploy/** get a group of their own and are never
# cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy/')) && format('run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/deploy/')) }}

# The ripgrep release both jobs install: the static musl build, which has PCRE2.
env:
  RG_VERSION: 15.2.0
  RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c

jobs:
  public-tree-scan:
    name: no internal literals or key-shaped strings in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Not preinstalled on the runner image. The scan needs the PCRE2 build
      # for its lookahead; the script verifies that itself and exits 2 rather
      # than reporting a clean tree it never searched. The release binary is
      # pinned by version and digest rather than taken from apt, whose mirrors
      # have failed to resolve on hosted runners and left main red.
      - name: Install ripgrep
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rg.tar.gz" "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/ripgrep-$RG_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$RG_SHA256  $RUNNER_TEMP/rg.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rg"
          tar -xzf "$RUNNER_TEMP/rg.tar.gz" -C "$RUNNER_TEMP/rg" --strip-components=1
          echo "$RUNNER_TEMP/rg" >> "$GITHUB_PATH"

      - name: Run public-tree-scan
        run: |
          bash scripts/release-tests/public-tree-scan.sh

  public-message-scan:
    name: no internal literals in commit messages or author identities
    # Pull requests only. This is the last point at which a message or an
    # author field can still be amended; once the commits are on main, a
    # follow-up commit cannot unpublish them.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The scan walks from the base commit, which a shallow clone omits.
          fetch-depth: 0

      - name: Install ripgrep
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rg.tar.gz" "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/ripgrep-$RG_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$RG_SHA256  $RUNNER_TEMP/rg.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rg"
          tar -xzf "$RUNNER_TEMP/rg.tar.gz" -C "$RUNNER_TEMP/rg" --strip-components=1
          echo "$RUNNER_TEMP/rg" >> "$GITHUB_PATH"

      - name: Run public-message-scan
        run: |
          bash scripts/release-tests/public-message-scan.sh \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
