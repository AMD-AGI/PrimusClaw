name: Agent Sandbox Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'sandbox/**'
      - '.github/workflows/agent-sandbox-build.yaml'
      - '.github/scripts/image-scan.sh'
  pull_request:
    paths:
      - 'sandbox/**'
      - '.github/workflows/agent-sandbox-build.yaml'
      - '.github/scripts/image-scan.sh'
  workflow_dispatch:

# Least privilege for the default GITHUB_TOKEN. Registry pushes authenticate
# with their own credentials, not this token, so read access to the checkout is
# all any job here needs.
permissions:
  contents: read

# A new pull request head cancels the previous head's run. Pushes stay
# serialised per ref, as before, so registry pushes do not race, and a push
# run that has started is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      image_version: ${{ steps.get-image-version.outputs.image_version }}
      date_time: ${{ steps.get-current-time.outputs.date_time }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Calculate ImageVersion
        id: get-image-version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            echo "image_version=$TAG" >> $GITHUB_OUTPUT
          else
            echo "image_version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Get Current Time
        id: get-current-time
        run: |
          FORMATTED_DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M')
          echo "date_time=$FORMATTED_DATE" >> $GITHUB_OUTPUT
          echo "Formatted date: $FORMATTED_DATE"

      - name: Generate matrix
        id: generate-matrix
        run: |
          echo 'matrix={"include":[{"name":"agent-sandbox-controlplane","context_path":"sandbox","dockerfile_path":"sandbox/docker/Dockerfile.controlplane"},{"name":"agent-sandbox-envd-injector","context_path":"sandbox","dockerfile_path":"sandbox/docker/Dockerfile.envd-injector"}]}' >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner image ships Buildah; apt runs only where it is missing, bounded (see build.yaml).
      - name: Install Buildah
        run: |
          set -euo pipefail
          if ! command -v buildah >/dev/null; then
            apt=(sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            "${apt[@]}" update
            "${apt[@]}" install -y buildah
          fi
          buildah --version

      - name: Login Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          echo "Logging in to Docker Hub..."
          buildah login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}" docker.io

      - name: Build sandbox image
        env:
          REPOSITORY: docker.io/primussafe
          IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
          DATE_TIME: ${{ needs.prepare.outputs.date_time }}
        run: |
          set -e
          echo "Building ${{ matrix.name }}..."

          buildah bud \
            --layers \
            -t ${{ matrix.name }}:${IMAGE_VERSION} \
            -t ${{ matrix.name }}:${DATE_TIME} \
            -f ${{ matrix.dockerfile_path }} ${{ matrix.context_path }}

      # Before anything is pushed, the image goes through the scan that gates the publication of a public image: the
      # same Trivy release and parameters, no ignore list (.github/scripts/image-scan.sh says what fails and why). A
      # finding stops the push.
      - name: Export the image for the scan
        env:
          NAME: ${{ matrix.name }}
          IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-scan"
          buildah push "localhost/$NAME:$IMAGE_VERSION" "docker-archive:$RUNNER_TEMP/image-scan/$NAME.tar:$NAME:$IMAGE_VERSION"

      - name: Day of the scanner's database cache
        id: scan-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Trivy's vulnerability database and checks bundle, one cache a day. Trivy still replaces a database past its
      # own next-update time, exactly as on any runner, so the cache saves the download and changes no answer.
      - name: Restore the scanner's database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
            ~/.cache/trivy/policy
          key: image-scan-trivy-0.74.0-${{ steps.scan-day.outputs.day }}
          restore-keys: image-scan-trivy-0.74.0-

      - name: Scan the image as its publication will
        env:
          NAME: ${{ matrix.name }}
        run: bash .github/scripts/image-scan.sh "$NAME" "$RUNNER_TEMP/image-scan/$NAME.tar"

      - name: Push sandbox image
        id: push
        if: github.event_name != 'pull_request'
        env:
          REPOSITORY: docker.io/primussafe
          IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
          DATE_TIME: ${{ needs.prepare.outputs.date_time }}
        run: |
          set -e
          echo "Pushing ${{ matrix.name }} to ${REPOSITORY}..."
          buildah tag ${{ matrix.name }}:${IMAGE_VERSION} ${REPOSITORY}/${{ matrix.name }}:${IMAGE_VERSION}
          buildah tag ${{ matrix.name }}:${DATE_TIME} ${REPOSITORY}/${{ matrix.name }}:${DATE_TIME}
          buildah push --digestfile "$RUNNER_TEMP/version-digest" ${REPOSITORY}/${{ matrix.name }}:${IMAGE_VERSION}
          buildah push --digestfile "$RUNNER_TEMP/build-digest" ${REPOSITORY}/${{ matrix.name }}:${DATE_TIME}
          version_digest="$(cat "$RUNNER_TEMP/version-digest")" build_digest="$(cat "$RUNNER_TEMP/build-digest")"
          for d in "$version_digest" "$build_digest"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::buildah reported digest \"$d\""; exit 1; }
          done
          {
            echo "repository=${REPOSITORY}/${{ matrix.name }}"
            echo "build-digest=$build_digest"
            echo "version-digest=$version_digest"
          } >> "$GITHUB_OUTPUT"

      # The digests go to the attest job: only that job, which runs no repository code, may sign with the workflow's
      # OIDC identity.
      - name: Hand the pushed digests to the attest job
        if: steps.push.outcome == 'success'
        env:
          REPOSITORY: ${{ steps.push.outputs.repository }}
          BUILD_DIGEST: ${{ steps.push.outputs.build-digest }}
          VERSION_DIGEST: ${{ steps.push.outputs.version-digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-digest"
          printf '%s\n' "$REPOSITORY" > "$RUNNER_TEMP/image-digest/repository"
          printf '%s\n' "$BUILD_DIGEST" > "$RUNNER_TEMP/image-digest/build-digest"
          printf '%s\n' "$VERSION_DIGEST" > "$RUNNER_TEMP/image-digest/version-digest"

      - name: Upload the pushed digests
        if: steps.push.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/image-digest/
          retention-days: 1
          if-no-files-found: error

      - name: Record image tags
        env:
          IMAGE_VERSION: ${{ needs.prepare.outputs.image_version }}
          DATE_TIME: ${{ needs.prepare.outputs.date_time }}
        run: |
          {
            echo "## Built image"
            echo ""
            echo "- image: \`${{ matrix.name }}\`"
            echo "- latest tag: \`${IMAGE_VERSION}\`"
            echo "- timestamp tag: \`${DATE_TIME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Signs the build provenance of each pushed image, as the personal agent's release does for its image. The build tag
  # is what deployments pin and what a release relays by digest to the ROCm staging repository (image-relay.yml); a
  # copy that keeps the digest keeps the attestation valid for it. This job checks out and runs nothing from the
  # repository and never runs for a pull request, so the OIDC permission is never given to code a pull request
  # controls. `gh attestation verify oci://<image>@<digest> --repo AMD-AGI/PrimusClaw` checks it.
  attest:
    name: Attest pushed images
    needs: [prepare, build]
    if: always() && github.event_name != 'pull_request' && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write # sign the attestation
      attestations: write # store it
    steps:
      # A leg whose build failed, or an image this workflow never pushes, uploaded no digests; that leg attests nothing.
      - name: Fetch the pushed digests
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/image-digest

      - name: Read the pushed digests
        id: digests
        if: steps.fetch.outcome == 'success'
        env:
          NAME: ${{ matrix.name }}
          DIR: ${{ runner.temp }}/image-digest
        run: |
          set -euo pipefail
          repository="$(cat "$DIR/repository")" build_digest="$(cat "$DIR/build-digest")" version_digest="$(cat "$DIR/version-digest")"
          [ "$repository" = "docker.io/primussafe/$NAME" ] || { echo "::error::unexpected repository \"$repository\""; exit 1; }
          for d in "$build_digest" "$version_digest"; do
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest \"$d\""; exit 1; }
          done
          {
            echo "repository=$repository"
            echo "build-digest=$build_digest"
            echo "version-digest=$version_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the image's provenance
        if: steps.digests.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.repository }}
          subject-digest: ${{ steps.digests.outputs.build-digest }}

      # The two tags are two pushes of one image and normally one digest; should they differ, the other is attested too.
      - name: Attest the version tag's provenance
        if: steps.digests.outcome == 'success' && steps.digests.outputs.version-digest != steps.digests.outputs.build-digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.repository }}
          subject-digest: ${{ steps.digests.outputs.version-digest }}
