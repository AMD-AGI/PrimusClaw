name: CodeQL

# Pull requests always run, documentation-only ones included: the main
# ruleset's "Require code scanning results" rule (tool CodeQL) blocks a pull
# request until CodeQL has reported an analysis for it, and a workflow skipped
# by a paths filter reports nothing, so a doc-only pull request could never
# merge. Pushes to main/deploy/** still skip doc-only commits; the weekly
# schedule runs a full analysis on the default branch.
on:
  push:
    # main and the deploy/* branches only: every other branch reaches CI as a
    # pull request, and a push trigger there ran the whole workflow a second
    # time on the same commit (the two runs sit in different concurrency
    # groups, so neither cancelled the other).
    branches:
      - main
      - "deploy/**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"
  # No paths filter here: see the comment at the top of the file.
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  # ``codeql-action/analyze`` reads the current workflow run via
  # ``GET /repos/.../actions/runs/{id}`` to attach run metadata to the
  # SARIF upload + send completion telemetry. Without ``actions: read``
  # both calls fail with ``Resource not accessible by integration``.
  actions: read

# One run per pull request: a new head cancels the previous head's run.
# Every other event (push to main or deploy/**, tags, schedules, manual runs)
# gets a group of its own, so it is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Go is a compiled language; CodeQL needs the module toolchain to
      # trace the build. The only Go module lives under ``sandbox/``.
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: sandbox/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality

      # Manual build for Go: CodeQL wraps this step to extract the database.
      - name: Build Go module
        if: matrix.build-mode == 'manual'
        working-directory: sandbox
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
