name: Lint

on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"
  push:
    branches:
      - '**'
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"

# Least privilege for the default GITHUB_TOKEN. Registry pushes authenticate
# with their own credentials, not this token, so read access to the checkout is
# all any job here needs.
permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace-sync-hands-timeout:
    name: enforce withHandsTimeout in workspace-sync/reaper
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run lint-no-direct-hands-calltool-in-workspace
        run: |
          bash claw/scripts/lint-no-direct-hands-calltool-in-workspace.sh --all

  metrics-must-register:
    name: enforce registers:[registry] on every prom-client metric
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run lint-metrics-must-register
        run: |
          bash claw/scripts/lint-metrics-must-register.sh --all
          bash claw/scripts/lint-metrics-must-register.sh --self-test

  startup-calls-rollout-assert:
    name: enforce main() asserts the rollout config before it listens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The self-test boots the real index.ts, which resolves @claw/* through
      # each package's dist, so this guard needs the workspaces installed and
      # built rather than the bare tree the other lint jobs scan.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: claw/.nvmrc
          cache: npm
          cache-dependency-path: claw/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: claw

      - name: Build workspaces
        run: npm run build
        working-directory: claw

      - name: Run lint-startup-calls-rollout-assert
        run: |
          bash claw/scripts/lint-startup-calls-rollout-assert.sh --all
          bash claw/scripts/lint-startup-calls-rollout-assert.sh --self-test

  llm-settings-must-be-deployable:
    name: enforce that every LLM_*/PROMPT_CACHE_* setting reaches a cluster
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run lint-llm-settings-deployable
        run: |
          bash claw/scripts/lint-llm-settings-deployable.sh

  session-events-must-redact:
    name: enforce redaction on routes reading claw_session_events.data
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run lint-session-events-must-redact
        run: |
          bash claw/scripts/lint-session-events-must-redact.sh --all

  checkpoint-must-seal:
    name: keep the checkpoint out of the observability redactor
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run lint-checkpoint-must-seal
        run: |
          bash claw/scripts/lint-checkpoint-must-seal.sh

  tenant-routes-must-authorize:
    name: enforce an ownership check on tenant-scoped routes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run lint-tenant-routes-must-authorize
        run: |
          bash claw/scripts/lint-tenant-routes-must-authorize.sh --all

  drain-shutdown-guard:
    name: enforce the SIGTERM guard uses the shutdown latch, not the drain flag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run lint-drain-shutdown-guard
        run: |
          bash claw/scripts/lint-drain-shutdown-guard.sh --all

  dockerfile-build-order:
    name: enforce the Dockerfile build order matches package.json "workspaces"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run lint-dockerfile-build-order
        run: |
          bash claw/scripts/lint-dockerfile-build-order.sh --all

  no-nullish-env-default:
    name: forbid ?? defaults on process.env (blank must take the default)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run lint-no-nullish-env-default
        run: |
          bash claw/scripts/lint-no-nullish-env-default.sh --all

  promql-rollout-gates:
    name: evaluate the rollout gates against the PromQL engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install promtool
        run: |
          bash scripts/release-tests/install-promtool.sh

      - name: Run promql-gates
        run: |
          bash scripts/release-tests/promql-gates.sh

  gofmt:
    name: gofmt (Sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: sandbox/go.mod

      - name: Verify gofmt
        run: make fmt-verify
        working-directory: sandbox

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install reuse
        run: pip install reuse

      # Validates REUSE.toml itself, including the two-copyright-holder array on
      # the sandbox/** override, and that every file resolves to a license.
      - name: Run reuse lint
        run: reuse lint
