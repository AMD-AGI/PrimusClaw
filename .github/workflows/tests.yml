name: Tests

# The Python suites run in tests-coverage.yml. This workflow covers the
# TypeScript and Go trees, which had no CI execution at all: a broken build or a
# failing unit test in Claw or Sandbox could be merged without anything
# noticing.
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claw:
    name: Claw (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: claw
    # The doorbell concurrency suite needs two connections holding two
    # transactions against one server, which PGlite cannot host. Both this job
    # and claw-node-tests.yaml run the whole workspace glob, so a service on
    # only one of them leaves the other skipping the exactly-once proof.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: claw/.nvmrc
          cache: npm
          cache-dependency-path: claw/package-lock.json

      - run: npm ci

      # Build first: `npm test` runs the sources through tsx, so a type error
      # that only tsc catches would otherwise slip through.
      - run: npm run build

      # The test directory is outside every package's `typecheck`, so a name in
      # a stub that resolves to nothing throws a ReferenceError the surrounding
      # seam catches -- and the test passes having asserted nothing. This is the
      # only job that builds Claw, so it is the only place the guard can run.
      - name: Tests must resolve
        run: |
          bash scripts/lint-tests-must-resolve.sh --self-test
          bash scripts/lint-tests-must-resolve.sh --all

      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      # End-to-end smoke test over the real MCP transport: starts Hands against
      # a temporary workspace and drives it. Needs no cluster, GPU or LLM key,
      # and keeps the published example from rotting unnoticed.
      - name: Minimal demo (Hands over MCP)
        run: ./examples/hands-mcp/run.sh

  connector:
    name: Connector (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: claw/.nvmrc
          cache: npm
          cache-dependency-path: connector/package-lock.json

      # The connector compiles the wire contract from claw/packages/protocol
      # (a single dependency-free file), so it needs only its own install.
      - run: npm ci
        working-directory: connector

      - run: npm run typecheck
        working-directory: connector

      # Real child processes and sockets: a stand-in Claw and a stand-in ACP
      # adapter, no database and no network beyond the loopback.
      - run: npm test
        working-directory: connector

      - name: The bundle builds and runs
        working-directory: connector
        run: |
          npm run build
          node dist/cli.js --version

      # What `npm publish` would upload (connector-release.yml does it on a tag): only the
      # bundle, README and LICENSE, the bin and engines fields, and a version the built CLI
      # reports. Checked here on every change so a release is never the first time anyone looks.
      - name: The package ships only what it should
        working-directory: connector
        run: node scripts/check-pack.mjs

  sandbox:
    name: Sandbox (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: sandbox/go.mod
          cache-dependency-path: sandbox/go.sum

      - run: go build ./...

      - run: go vet ./...

      # e2e suites are behind the `e2e` build tag and need a cluster, so a plain
      # `go test ./...` covers exactly the unit tests.
      - run: go test ./...

  sandbox-chart:
    name: Sandbox chart (namespace admission, router Ingress)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: python3 -c 'import yaml' || sudo apt-get install -y python3-yaml

      - run: bash scripts/release-tests/sandbox-router-ingress.sh

  litellm-existing-secret:
    name: LiteLLM existingSecret handling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: bash scripts/release-tests/litellm-existing-secret.sh

  litellm-prompt-cache-hook:
    name: LiteLLM prompt-cache hook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: bash scripts/release-tests/litellm-prompt-cache-hook.sh
