name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"
  # Pull requests build the affected images without pushing, so a Dockerfile or
  # build-context break is caught in review rather than after it lands on main.
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"

# Least privilege for the default GITHUB_TOKEN. Registry pushes authenticate
# with their own credentials, not this token, so read access to the checkout is
# all any job here needs.
permissions:
  contents: read

# A new pull request head cancels the previous head's run. Pushes stay
# serialised per ref, as before, so registry pushes do not race, and a push
# run that has started is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      image_version: ${{ steps.get-image-version.outputs.image_version }}
      date_time: ${{ steps.get-current-time.outputs.date_time }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Calculate ImageVersion
      id: get-image-version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          TAG=${GITHUB_REF#refs/tags/}
          echo "image_version=$TAG" >> $GITHUB_OUTPUT
        else
          echo "image_version=latest" >> $GITHUB_OUTPUT
        fi

    - name: Get Current Time
      id: get-current-time
      run: |
        FORMATTED_DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M')
        echo "date_time=$FORMATTED_DATE" >> $GITHUB_OUTPUT
        echo "Formatted date: $FORMATTED_DATE"

    - name: Detect changed files with git diff
      id: detect-changes
      run: |
        set -e

        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "Release tag: rebuilding every image in this workflow"
          echo "workflow_changed=true" >> "$GITHUB_OUTPUT"
          echo "claw_changed=true" >> "$GITHUB_OUTPUT"
          echo "personal_agent_changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "${{ github.event_name }}" == "push" ]]; then
          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_COMMIT="HEAD^"
          else
            BASE_COMMIT="${{ github.event.before }}"
          fi
          HEAD_COMMIT="${{ github.sha }}"
        else
          BASE_COMMIT="HEAD^"
          HEAD_COMMIT="HEAD"
        fi

        echo "Comparing $BASE_COMMIT...$HEAD_COMMIT"
        CHANGED_FILES=$(git diff --name-only $BASE_COMMIT $HEAD_COMMIT || echo "")
        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Changes to the workflow itself should rebuild all images described by
        # this workflow, so a CI-only edit is still validated end-to-end.
        if echo "$CHANGED_FILES" | grep -qE '^\.github/workflows/build\.yaml$'; then
          WORKFLOW_CHANGED=true
          echo "workflow_changed=true" >> $GITHUB_OUTPUT
        else
          WORKFLOW_CHANGED=false
          echo "workflow_changed=false" >> $GITHUB_OUTPUT
        fi

        # personal-agent-teams: the three npm packages, built from personal-agent/ and the Claw wire contract it
        # compiles in (claw/packages/protocol), installed into personal-agent/Dockerfile's image. Built only:
        # never pushed by this workflow (see "Push with Buildah").
        if [[ "$WORKFLOW_CHANGED" == "true" ]] || echo "$CHANGED_FILES" | grep -qE '^(personal-agent/|claw/packages/protocol/|claw/tsconfig\.base\.json$|LICENSE$)'; then
          echo "personal_agent_changed=true" >> $GITHUB_OUTPUT
        else
          echo "personal_agent_changed=false" >> $GITHUB_OUTPUT
        fi

        # claw (unified image): TS monorepo sources baked into claw/Dockerfile
        if [[ "$WORKFLOW_CHANGED" == "true" ]] || echo "$CHANGED_FILES" | grep -qE '^(claw/packages/|claw/deploy/|claw/package\.json$|claw/package-lock\.json$|claw/tsconfig.*\.json$|claw/Dockerfile$)'; then
          echo "claw_changed=true" >> $GITHUB_OUTPUT
        else
          echo "claw_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Generate matrix
      id: generate-matrix
      run: |
        MATRIX='{"include":['
        if [[ "${{ steps.detect-changes.outputs.claw_changed }}" == "true" ]]; then
          MATRIX+='{"name":"claw","context_path":"claw","dockerfile_path":"claw/Dockerfile"},'
        fi
        # "push":"no": the image is built and smoke-tested here, never pushed (a release publishes it).
        if [[ "${{ steps.detect-changes.outputs.personal_agent_changed }}" == "true" ]]; then
          MATRIX+='{"name":"personal-agent-teams","context_path":".","dockerfile_path":"personal-agent/Dockerfile","push":"no"},'
        fi
        MATRIX=${MATRIX%,}
        MATRIX+=']}'
        echo "Generated matrix: $MATRIX"
        echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

        # A matrix entry for a component that no longer exists stays invisible
        # until something else forces a full rebuild, and then fails deep inside
        # buildah with `no such file or directory`. Check the paths here, where
        # the message names the entry that went stale.
        echo "$MATRIX" | python3 -c '
        import json, os, sys
        missing = []
        for entry in json.load(sys.stdin)["include"]:
            for field in ("context_path", "dockerfile_path"):
                if not os.path.exists(entry[field]):
                    missing.append(entry["name"] + ": " + field + "=" + entry[field])
        if missing:
            sys.exit("matrix entries point at paths that do not exist: " + "; ".join(missing))
        '

  build:
    needs: detect-changes
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    if: ${{ needs.detect-changes.outputs.matrix != '' && needs.detect-changes.outputs.matrix != '{"include":[]}' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      # Pull requests build but never push, so they need no registry credentials
      # at all. A failed login now fails the job: previously it was swallowed by
      # `|| echo`, and the run continued to the push, which then failed with an
      # authentication error far from its actual cause.
      - name: Login registries
        if: github.event_name != 'pull_request' && matrix.push != 'no'
        run: |
          echo "Logging in to Docker Hub..."
          buildah login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}" docker.io

      - name: Build with Buildah
        env:
          IMAGE_VERSION: ${{ needs.detect-changes.outputs.image_version }}
          DATE_TIME: ${{ needs.detect-changes.outputs.date_time }}
        run: |
          set -e
          echo "Building ${{ matrix.name }}..."

          buildah bud \
            --layers \
            --build-context agent-sandbox=sandbox \
            --build-arg CLAW_BUILD=${DATE_TIME} \
            -t ${{ matrix.name }}:${IMAGE_VERSION} \
            -t ${{ matrix.name }}:${DATE_TIME} \
            -f ${{ matrix.dockerfile_path }} ${{ matrix.context_path }}

      # The claw image reports its own build to the assistant through CLAW_BUILD
      # (claw/Dockerfile). Assert the image just built carries exactly the tag it
      # is about to be pushed under, so a dropped build-arg fails here rather
      # than as "build unknown" on a live deployment.
      - name: Assert the image knows its tag
        if: matrix.name == 'claw'
        env:
          DATE_TIME: ${{ needs.detect-changes.outputs.date_time }}
        run: |
          set -e
          ENVS=$(buildah inspect --type image --format '{{range .OCIv1.Config.Env}}{{println .}}{{end}}' ${{ matrix.name }}:${DATE_TIME})
          GOT=$(printf '%s\n' "$ENVS" | sed -n 's/^CLAW_BUILD=//p')
          echo "CLAW_BUILD in image: '${GOT}', tag: '${DATE_TIME}'"
          if [[ -z "$DATE_TIME" || "$GOT" != "$DATE_TIME" ]]; then
            echo "::error::claw image CLAW_BUILD='${GOT}' does not equal its tag '${DATE_TIME}'"
            exit 1
          fi

      # The personal agent's image as it would run: as uid 65534, with the three packages at the version they were
      # built as, and, started through the release gate's test entry (loopback only, no queue, no real Teams or
      # Claw), answering /healthz and naming its build on /metrics.
      - name: Smoke-test the personal agent image
        if: matrix.name == 'personal-agent-teams'
        env:
          IMAGE: localhost/${{ matrix.name }}:${{ needs.detect-changes.outputs.image_version }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./personal-agent/packages/teams/package.json").version')
          USER_ID=$(podman run --rm "$IMAGE" id -u)
          echo "user in image: $USER_ID"
          [[ "$USER_ID" == "65534" ]] || { echo "::error::the image runs as uid $USER_ID, expected 65534"; exit 1; }
          GOT=$(podman run --rm -w /app "$IMAGE" node -p 'const v=(n)=>require("./node_modules/@primusclaw/"+n+"/package.json").version; [v("personal-agent"),v("personal-agent-runtime"),v("personal-agent-teams")].join(" ")')
          echo "packages in image: $GOT"
          [[ "$GOT" == "$VERSION $VERSION $VERSION" ]] || { echo "::error::packages in the image are '$GOT', expected $VERSION"; exit 1; }
          podman run -d --name pa-smoke --network host \
            -e TEAMS_ENCRYPTION_KEYS="$(head -c 32 /dev/urandom | base64 | tr '+/' '-_')" \
            -e TEAMS_DB_PATH=/data/state.db -e PUBLIC_BASE_URL=https://claw.example.com \
            -e CLAW_API_URL=http://claw.invalid -e SAFE_API_URL=http://safe.invalid/api/v1 \
            -e OUTBOUND_MODE=direct -e BOT_MSI_CLIENT_ID=smoke -e SECRETS_SOURCE=env \
            -e TEAMS_GATE_ENTRY=1 -e GATE_RUN_ID=image-smoke -e TEAMS_GATE_CONNECTOR_URL=http://127.0.0.1:9 \
            -e PORT=18080 -e METRICS_PORT=19090 \
            "$IMAGE"
          ok=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [[ -z "$ok" ]]; then echo "::error::/healthz did not answer within 60 s"; podman logs pa-smoke; exit 1; fi
          METRICS=$(curl -fsS http://127.0.0.1:19090/metrics)
          grep '^personal_agent_build_info' <<<"$METRICS" || true
          grep -q "^personal_agent_build_info{version=\"$VERSION\"," <<<"$METRICS" \
            || { echo "::error::/metrics does not name version $VERSION"; podman logs pa-smoke; exit 1; }
          podman stop -t 10 pa-smoke >/dev/null

      - name: Push with Buildah
        if: github.event_name != 'pull_request' && matrix.push != 'no'
        env:
          # The registry and namespace images are pushed to, a repository variable so a move needs no workflow edit.
          DOCKERIO_REPOSITORY: ${{ vars.IMAGE_REPOSITORY_PREFIX || 'docker.io/primussafe' }}
          IMAGE_VERSION: ${{ needs.detect-changes.outputs.image_version }}
          DATE_TIME: ${{ needs.detect-changes.outputs.date_time }}
        run: |
          set -e
          echo "Pushing ${{ matrix.name }} to ${DOCKERIO_REPOSITORY}..."
          buildah tag ${{ matrix.name }}:${IMAGE_VERSION} ${DOCKERIO_REPOSITORY}/${{ matrix.name }}:${IMAGE_VERSION}
          buildah tag ${{ matrix.name }}:${DATE_TIME} ${DOCKERIO_REPOSITORY}/${{ matrix.name }}:${DATE_TIME}
          buildah push ${DOCKERIO_REPOSITORY}/${{ matrix.name }}:${IMAGE_VERSION}
          buildah push ${DOCKERIO_REPOSITORY}/${{ matrix.name }}:${DATE_TIME}
