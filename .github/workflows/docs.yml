name: Docs

# Deliberately a separate workflow: every other one lists `docs/**` under
# paths-ignore, so a job placed there would never run for a documentation-only
# change. That is how this site came to claim it published an API reference while
# `docs/api/` did not exist. Python sources are included as triggers too, because
# the pages are generated from their docstrings.
on:
  push:
    paths:
      - "docs/**"
      - "memory/memory-service/src/**"
      - "memory/knowledge-worker/src/**"
      - "sandbox/sdk-python/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "memory/memory-service/src/**"
      - "memory/knowledge-worker/src/**"
      - "sandbox/sdk-python/**"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sphinx:
    name: Sphinx build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt

      # -W turns warnings into errors. Malformed docstrings render as broken
      # pages rather than failing, so without this the build stays "green" while
      # the output degrades.
      - name: Build docs
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html

      # A build with no API content would otherwise pass. The three packages
      # currently contribute far more than this; the floor only catches autodoc
      # silently documenting nothing, e.g. after a sys.path or layout change.
      - name: Assert the API reference is not empty
        run: |
          set -e
          count=$(grep -ro 'id="module-' docs/_build/html/api | wc -l)
          echo "documented modules: $count"
          if [ "$count" -lt 20 ]; then
            echo "::error::API reference collapsed to $count modules (expected >= 20)."
            exit 1
          fi
