version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  # Node / TypeScript
  - package-ecosystem: "npm"
    directory: "/claw"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Python packages
  - package-ecosystem: "npm"
    directory: "/connector"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/personal-agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # typescript-eslint 8.72 declares a peer of typescript >=4.8.4 <6.1.0, so any
    # bump past 6.0.x (7.0.2 was one) fails `npm ci` with ERESOLVE. Raise this
    # bound together with typescript-eslint once its peer range allows more.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: "pip"
    directories:
      - "/sandbox/sdk-python"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Go module (Sandbox)
  - package-ecosystem: "gomod"
    directory: "/sandbox"
    schedule:
      interval: "monthly"
    groups:
      gomod:
        patterns: ["*"]

  # Docker base images. Every directory containing a Dockerfile must be listed;
  # dependabot does not discover them, so an omission is silent.
  - package-ecosystem: "docker"
    directories:
      - "/claw"
      - "/deploy/litellm"
      - "/personal-agent"
      - "/sandbox/docker"
    schedule:
      interval: "monthly"
    groups:
      docker:
        patterns: ["*"]
        # One PR per base image across all listed Dockerfiles.
        group-by: dependency-name
