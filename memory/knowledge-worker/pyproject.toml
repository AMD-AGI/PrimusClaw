[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claw-knowledge-worker"
version = "0.1.0"
description = "Knowledge worker. Turns raw session events into KB articles via the KB Service."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Advanced Micro Devices, Inc."}]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[project.scripts]
claw-knowledge-worker = "knowledge_worker.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
