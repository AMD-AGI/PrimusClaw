{{- if eq (include "claw-memory-service.useBundledPostgres" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "claw-memory-service.postgresName" . }}
  namespace: {{ include "claw-memory-service.namespace" . }}
  labels:
    {{- include "claw-memory-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "claw-memory-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "claw-memory-service.postgresName" . }}
  namespace: {{ include "claw-memory-service.namespace" . }}
  labels:
    {{- include "claw-memory-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "claw-memory-service.postgresName" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "claw-memory-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "claw-memory-service.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: {{ default (printf "%s-secret" (include "claw-memory-service.postgresName" .)) .Values.postgres.auth.existingSecret }}
          volumeMounts:
            - name: data
              # subPath, not the volume root. /var/lib/postgresql/data is the
              # official image's PGDATA and its entrypoint runs initdb there,
              # but initdb refuses a directory that is not empty -- and most
              # provisioners hand over a fresh ext4 volume containing
              # lost+found, so the container crash-loops on
              # "directory ... exists but is not empty" the first time it is
              # given a real PVC. Mounting a subdirectory gives initdb the
              # empty directory it requires.
              #
              # Changing this on an existing install points PGDATA at a new,
              # empty path: Postgres will initialise a fresh database and the
              # old one, still on the volume one level up, will look lost. It
              # is safe here only because this ships in the first release.
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
  {{- end }}
{{- end }}
