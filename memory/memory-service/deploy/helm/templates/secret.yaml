{{- $useBundledPostgres := eq (include "claw-memory-service.useBundledPostgres" .) "true" }}
{{- if not .Values.externalDatabase.existingSecret }}
{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabase.url) }}
{{- fail "externalDatabase.url or externalDatabase.existingSecret is required when postgres.enabled=false" }}
{{- end }}
{{- if not $useBundledPostgres }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claw-memory-service.fullname" . }}-secret
  namespace: {{ include "claw-memory-service.namespace" . }}
  labels:
    {{- include "claw-memory-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  MEMORY_SERVICE_DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
{{- end }}
{{- end }}
