# Kept in its own file so the memory-service Deployment can hash exactly these
# credentials and roll its Pods when they change.
{{- if and (eq (include "claw-memory-service.useBundledPostgres" .) "true") (not .Values.postgres.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claw-memory-service.postgresName" . }}-secret
  namespace: {{ include "claw-memory-service.namespace" . }}
  labels:
    {{- include "claw-memory-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.auth.password is required when postgres.auth.existingSecret is empty" .Values.postgres.auth.password | quote }}
{{- end }}
