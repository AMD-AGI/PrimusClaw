apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.fullname" . }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: litellm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- /*
        config.yaml is mounted with subPath, and a subPath mount is a copy made
        at start: kubelet never refreshes it when the ConfigMap changes. Without
        this hash the pods keep serving the model list they booted with -- a
        changed api_base, provider or model set reaches the ConfigMap and stops
        there, with nothing in the rollout to say so. Hashing the rendered
        ConfigMap makes any of those a pod-template change, which is what makes
        Kubernetes replace the Pods.
        */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app: litellm
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
      - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
      - name: litellm
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - "--config"
        - "/app/config.yaml"
        - "--port"
        - "{{ .Values.port }}"
        ports:
        - name: http
          containerPort: {{ .Values.port }}
        env:
        - name: SERVER_ROOT_PATH
          value: {{ .Values.serverRootPath | quote }}
        - name: STORE_MODEL_IN_DB
          value: "True"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "litellm.secretName" . }}
              key: database_url
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "litellm.secretName" . }}
              key: master_key
        - name: SAFE_API_URL
          value: {{ .Values.safeApiUrl | quote }}
        {{- with .Values.providerApiKey }}
        {{- if .secretName }}
        {{- /*
        Quoted, all three. Unquoted, YAML resolves `true`/`false`/`null` and
        bare digits to their scalar types, so a Secret genuinely named "true"
        renders a boolean the API server rejects, and one named "null" or
        "false" makes the `if` above falsy -- the env var silently disappears
        and the proxy starts with no provider key rather than failing.
        */}}
        - name: {{ .envName | default "LITELLM_PROVIDER_API_KEY" | quote }}
          valueFrom:
            secretKeyRef:
              name: {{ .secretName | quote }}
              key: {{ .secretKey | default "api_key" | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: {{ printf "%s/health/readiness" .Values.serverRootPath }}
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: {{ printf "%s/health/liveness" .Values.serverRootPath }}
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: {{ include "litellm.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
