{{- /*
Skipped entirely when secrets.existingSecret names a Secret you manage yourself.
Without that escape hatch a production database password and the master key have
to travel through Helm values, which puts both in the release history in plain
text -- and the master key is also the encryption key for every model credential
in the database, so it is the last thing that should be sitting there.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litellm.fullname" . }}
  labels:
    {{- include "litellm.labels" . | nindent 4 }}
type: Opaque
stringData:
  master_key: {{ required "secrets.masterKey is required" .Values.secrets.masterKey | quote }}
  database_url: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
{{- end }}
