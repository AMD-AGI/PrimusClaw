nameOverride: ""
fullnameOverride: ""

image:
  repository: docker.io/primussafe/litellm
  tag: "20260331111348"
  pullPolicy: Always
  pullSecret: ""

replicas: 1
port: 4000
serverRootPath: /llm-gateway

safeApiUrl: ""

secrets:
  # Name a Secret you already manage and the chart will not render its own.
  # It must carry the keys `master_key` and `database_url`. Use this rather
  # than the two below for anything real: values passed to Helm end up in the
  # release history in plain text, and master_key is not only the admin
  # credential -- it is also the encryption key for every model credential
  # stored in the database.
  existingSecret: ""
  masterKey: ""
  databaseUrl: ""

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi

ingress:
  enabled: false
  className: higress
  host: ""
  priority: "10"

nodeSelector: {}
tolerations: []

# Extra environment for the proxy container, appended verbatim -- raw env
# entries, so `valueFrom` works. Use it to hand the proxy the provider
# credentials a modelList entry refers to as `os.environ/<NAME>`, or the
# environment of any additional callback you load.
#
#   extraEnv:
#     - name: ANTHROPIC_API_KEY
#       valueFrom:
#         secretKeyRef: {name: my-provider-secret, key: anthropic_api_key}
extraEnv: []

# Merged over the chart's litellm_settings defaults (drop_params, set_verbose,
# and the prompt_cache_hook callback). Set `callbacks` here to replace that list --
# include the hook entry if you still want it. This is also where
# prometheus_metrics_config goes when `prometheus` is one of the callbacks.
litellmSettings: {}

# Rendered as general_settings verbatim (it replaces, not merges -- the
# chart has no defaults there). Empty renders `{}`.
generalSettings: {}

# Keep model routing out of the public chart defaults. Supply a private values
# file with modelList entries for your deployment (LITELLM_VALUES_FILE).
#
# Auto Routing (LiteLLM v1.96+ complexity_router) is also a modelList entry,
# not a separate Helm key. ConfigMap templates toYaml the whole list. See
# litellm/values.autorouting.example.yaml. Alias names must contain "claude"
# so prompt_cache_hook.py still injects Anthropic prompt-cache breakpoints.
# Do not put API keys in this public chart. Opt in at runtime with
# DEFAULT_MODEL=claude-auto; leave this list empty in public defaults.
# Skip deploy.sh interactive /models discovery when using a router entry —
# that prompt overwrites modelList from LITELLM_VALUES_FILE.
modelList: []

# Prometheus Operator ServiceMonitor for LiteLLM /metrics. Off by default
# because the monitoring.coreos.com CRDs may not be installed, and because
# scrape is useless until litellmSettings.callbacks includes prometheus.
# See deploy/litellm/README.md for a values snippet that keeps the prompt-cache hook.
#
# bearerTokenSecret is resolved in the ServiceMonitor namespace. Leave
# namespace empty (the release namespace) to reuse secrets.existingSecret.
# Setting namespace to another namespace requires bearerTokenSecret.name
# naming a Secret that already exists there.
serviceMonitor:
  enabled: false
  namespace: ""
  bearerTokenSecret:
    name: ""
    key: master_key
  labels: {}
  interval: 30s
  scrapeTimeout: 10s
  relabelings: []
  metricRelabelings: []
