{{- if .Values.controlplane.enabled }}
{{- with .Values.router.publicIngress }}
{{- if .enabled }}
{{- if not .hosts }}
{{- fail "router.publicIngress.enabled requires at least one host" }}
{{- end }}
{{- range .paths }}
{{- $raw := . | toString }}
{{- $path := trimSuffix "/" $raw }}
{{- $parts := splitList "/" (trimPrefix "/" $path) }}
{{- $head := "" }}
{{- if $parts }}
{{- $head = index $parts 0 }}
{{- end }}
{{- if or (not (hasPrefix "/" $raw)) (eq $path "") (eq $path "/") (eq $path "/v1") (and (or (eq $head "v1") (eq $head "v2") (eq $head "api")) (lt (len $parts) 2)) }}
{{- fail (printf "router.publicIngress path %q must name a specific route" $raw) }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ required "router.publicIngress.name is required" .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: agent-sandbox
    app.kubernetes.io/component: router
    app.kubernetes.io/instance: {{ $.Release.Name }}
    higress.io/resource-definer: higress
  {{- with .annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- range $.Values.router.publicIngress.paths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: agent-sandbox-router
                port:
                  number: {{ $.Values.controlplane.service.router.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
