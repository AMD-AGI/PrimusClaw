{{- /* Redis Secret — created by default; skip when redis.secret.create is false (reuse external Secret) */}}
{{- if or (not .Values.redis.secret) (not (hasKey .Values.redis.secret "create")) (.Values.redis.secret.create) }}
apiVersion: v1
kind: Secret
metadata:
  name: agent-sandbox-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if .Values.redis.deploy }}
  addr: "redis.{{ .Release.Namespace }}.svc:6379"
  {{- else }}
  addr: {{ .Values.redis.addr | quote }}
  {{- end }}
  password: {{ .Values.redis.password | quote }}
{{- end }}
