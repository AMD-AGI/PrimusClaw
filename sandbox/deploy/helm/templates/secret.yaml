{{- /* Redis Secret — created by default; skip when redis.secret.create is false (reuse external Secret) */}}
{{- if or (not .Values.redis.secret) (not (hasKey .Values.redis.secret "create")) (.Values.redis.secret.create) }}
apiVersion: v1
kind: Secret
metadata:
  name: agent-sandbox-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if .Values.redis.deploy }}
  addr: "redis.{{ .Release.Namespace }}.svc:6379"
  {{- else }}
  addr: {{ .Values.redis.addr | quote }}
  {{- end }}
  {{- /*
    `required`, not a plain quote: an empty password does NOT mean "no password configured",
    it renders a PASSWORDLESS Redis that looks healthy. redis-server treats `--requirepass ""`
    as authentication disabled (templates/redis.yaml), REDISCLI_AUTH is set from the same blank
    key so both probes still pass, and go-redis skips AUTH entirely (pkg/store/store_redis.go).
    The store holds session records from which EnvD reads per-user OPENAI_API_KEYs, so shipping
    it open is not a hardening nicety. install.sh always supplies a generated 32-char password,
    which is why a hand-run `helm install` with chart defaults was the only way to reach this and
    it went unnoticed. Same guard and same reasoning as memory/memory-service's postgres-secret.
  */}}
  password: {{ required "redis.password is required when redis.secret.create=true — an empty value renders a passwordless Redis (see values.yaml)" .Values.redis.password | quote }}
{{- end }}
