# agent-sandbox Helm Chart default values
# Override with: helm install agent-sandbox ./deploy/helm --set key=value

# ── Global ────────────────────────────────────────────────────────────────────
namespace: agent-sandbox-system
imagePullSecrets: []

# ── Unified Controlplane ──────────────────────────────────────────────────────
controlplane:
  enabled: true
  replicas: 1
  image:
    repository: primussafe/agent-sandbox-controlplane
    tag: latest                       # override per-release: --set controlplane.image.tag=<yyyymmddhhmm>
    pullPolicy: IfNotPresent
  ports:
    router: 8080
    workloadManager: 8081
    managerMetrics: 8082
    managerHealth: 8083
  config:
    leaderElect: true
    extensions: true
    sessionTimeout: 15m
    envdInjectorImage: "primussafe/agent-sandbox-envd-injector:latest"
    auditEnabled: true
    auditRetentionDays: 30
    sandboxImageRegistry: ""
    # Optional key=value selector applied to sandbox workload pods.
    sandboxNodeSelector: ""
    registrySecret: ""
    watchInterval: "30s"
  service:
    router:
      type: ClusterIP
      port: 8080
    workloadManager:
      type: ClusterIP
      port: 8080
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  extraEnv: []

# ── Redis ──────────────────────────────────────────────────────────────────────
# Redis is deployed independently via deploy-redis.sh, not updated with service deploys.
# When deploy=true, Helm also deploys Redis (for all-in-one installation).
redis:
  deploy: false                   # false=Redis already deployed via deploy-redis.sh
  addr: "redis.agent-sandbox-system:6379"   # In-cluster Redis Service address
  # An empty password here does NOT mean "inherit the existing Secret". With
  # secret.create: true (the default, just below) this chart WRITES this
  # value into Secret/agent-sandbox-redis, so an empty string overwrites the
  # password deploy-redis.sh generated -- and every consumer downstream reads
  # blank as "no auth", not as an error: redis-server treats `--requirepass ""`
  # as authentication disabled, redis-cli with an empty REDISCLI_AUTH sends no
  # AUTH and so both probes still pass, and go-redis skips AUTH entirely. With
  # redis.deploy=true the result is a passwordless Redis that reports healthy
  # while holding the session records EnvD reads per-user OPENAI_API_KEYs from.
  #
  # install.sh never reaches that state: it generates or reuses a 32-char
  # password and passes it in a values file. The exposed path was a hand-run
  # `helm install`, which is what the header of this file, build-images.sh and
  # deploy-redis.sh all print.
  #
  # There is deliberately NO `password` key here. templates/secret.yaml wraps it
  # in `required`, the way memory-service's postgres-secret.yaml and the claw
  # chart's secret.yaml do, so an unset password fails the render with a message
  # naming this file rather than shipping an open store. Carrying `password: ""`
  # as a documented default would defeat that: `required` accepts an empty
  # string, so the guard would pass and the blank would reach redis-server. Set
  # it with --set redis.password=... or in your own values file.
  db: 1                           # DB 1, isolated from legacy sandbox (DB 0)
  secret:
    create: true                  # false = skip creating Secret, reuse external Secret named agent-sandbox-redis
  # Settings below only apply when deploy=true
  # The probes shell out to redis-cli, which every redis image ships; an image
  # without it fails both probes and takes Redis out of the Service.
  image:
    reference: ""                  # optional full immutable reference; overrides repository/tag
    repository: redis
    tag: "7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storage:
    size: 100Gi
    storageClassName: "rbd"              # empty = use cluster default; set to e.g. "local-path" to pin

# ── Security posture ─────────────────────────────────────────────────────────
# READ THIS BEFORE DEPLOYING. The values shipped below are DEVELOPMENT defaults:
# authentication off and the egress proxy off. In that configuration a sandbox is
# an ordinary runc container with unrestricted outbound network access, and any
# caller that can reach the Router can create sandboxes and run code in them.
#
# The control plane refuses to start with `router.config.enableAuth: false`
# unless you also set `security.allowInsecureNoAuth: true`, so this cannot be
# reached silently. For anything beyond a throwaway cluster, see the
# "Production hardening" section of sandbox/README.md.
security:
  # Acknowledge running with authentication disabled. Development only.
  allowInsecureNoAuth: false

# ── Router (merged into controlplane; only config/extraEnv are consumed) ──────
router:
  config:
    maxConcurrentRequests: 1000
    # false leaves the Router and Workload Manager with NO auth middleware at
    # all — not a weaker check, none. Set true (plus safeApiUrl) in production.
    enableAuth: false
    safeApiUrl: ""                # required when enableAuth=true
  extraEnv: []

# ── Workload Manager (merged into controlplane; only config/extraEnv are consumed) ──
workloadmanager:
  config:
    # Mirrors router.config.enableAuth (the control plane copies it at startup).
    enableAuth: false
    safeApiUrl: ""
    gcInterval: 15s
    defaultTTL: 24h
  extraEnv: []

# ── Egress (egress traffic control) ───────────────────────────────────────────
# EnvD embedded transparent proxy: iptables REDIRECT intercepts outbound TCP for SSRF protection + DNS rebinding defense.
# When enabled, Pod gets CAP_NET_ADMIN/CAP_NET_RAW (dropped after init).
#
# This proxy is the ONLY network control in the reference deployment: Flannel has
# no NetworkPolicy support, so with `enabled: false` there is nothing restricting
# a sandbox's outbound traffic — it can reach the cluster API, link-local
# metadata endpoints and the public internet. Enable it in production.
egress:
  enabled: false                    # true = enable transparent proxy + SSRF protection
  extraBlockedCIDRs: ""             # Extra blocked CIDRs (comma-separated), e.g. "169.254.0.0/16,100.64.0.0/10"

# ── Inference (unified inference gateway) ─────────────────────────────────────
# OPENAI_BASE_URL injected via Pod env (global);
# OPENAI_API_KEY injected by EnvD at process level (per-user, fetched from Redis session).
# Backend LLM API keys only exist in LiteLLM memory, never enter sandbox Pods.
inference:
  enabled: false                    # true = enable unified inference gateway
  litellmEndpoint: ""               # LiteLLM inference gateway URL, e.g. http://litellm.agent-sandbox-system:4000/v1

