# agent-sandbox Helm Chart default values
# Override with: helm install agent-sandbox ./deploy/helm --set key=value

# ── Global ────────────────────────────────────────────────────────────────────
namespace: agent-sandbox-system
imagePullSecrets: []

# ── Unified Controlplane ──────────────────────────────────────────────────────
controlplane:
  enabled: true
  replicas: 1
  image:
    repository: primussafe/agent-sandbox-controlplane
    tag: latest                       # override per-release: --set controlplane.image.tag=<yyyymmddhhmm>
    pullPolicy: IfNotPresent
  ports:
    router: 8080
    workloadManager: 8081
    managerMetrics: 8082
    managerHealth: 8083
  config:
    leaderElect: true
    extensions: true
    envdInjectorImage: "primussafe/agent-sandbox-envd-injector:latest"
    auditEnabled: true
    auditRetentionDays: 30
    sandboxImageRegistry: ""
    # Optional key=value selector applied to sandbox workload pods.
    sandboxNodeSelector: ""
    registrySecret: ""
    watchInterval: "30s"
    # Extra CA anchors for sandboxes whose egress sits behind a TLS-intercepting
    # proxy, supplied per environment instead of baked into an image.
    # sandboxExtraCAConfigMap names a ConfigMap whose keys are PEM certificates;
    # it must exist in every namespace sandboxes run in (install.sh checks it).
    # When set, each sandbox mounts it at /etc/claw/extra-ca, runs the injector's
    # /setup-extra-ca.sh to merge it with its image's system bundle
    # into /shared/bin/ca-bundle.pem, and points SSL_CERT_FILE,
    # REQUESTS_CA_BUNDLE, CURL_CA_BUNDLE and NODE_EXTRA_CA_CERTS at that file.
    # A missing ConfigMap holds the pod in ContainerCreating; one without a
    # certificate fails the container with a message naming it.
    # sandboxExtraCARequired: true declares the anchor comes from the injector
    # image (built with EXTRA_CA_CERT_URLS) and fails the same way if it is empty.
    sandboxExtraCAConfigMap: ""
    sandboxExtraCARequired: false
    # primus-identity keys on the E2B API. Enabled when introspectUrl and
    # ownerPolicyConfigMap are both set. The client Secret holds client_id and
    # client_secret; the ConfigMap key policy.json holds the owner quota policy.
    # The policy is read at startup: a ConfigMap change needs a rollout restart.
    # The policy role must match the role of existing owner records.
    identity:
      introspectUrl: ""
      clientSecret: "agent-sandbox-identity-client"
      ownerPolicyConfigMap: ""
  # Graceful drain on rollout or eviction, in Kubernetes order:
  #  1. preStop sleeps preStopSleepSeconds while the Pod, already terminating,
  #     is removed from the Service endpoints and the gateway stops routing to
  #     it. Uses the native sleep action (Kubernetes >= 1.30; the image is
  #     distroless and has no sleep binary). 0 disables it.
  #  2. On SIGTERM /health/ready fails and the Router keeps accepting requests
  #     for delaySeconds -- the fallback where preStop is unavailable.
  #  3. The listener closes; in-flight proxied requests and streams get up to
  #     timeoutSeconds to finish, then the rest are closed.
  #  4. The Workload Manager and the rest get stopGraceSeconds to stop. The
  #     controllers stop at SIGTERM and release the leader lease at once, so
  #     the replacement Pod reconciles Sandboxes while this one still drains.
  # terminationGracePeriodSeconds defaults to the sum of all four plus 10s of
  # margin; an explicit value below that is refused.
  shutdown:
    preStopSleepSeconds: 10
    delaySeconds: 5
    timeoutSeconds: 60
    stopGraceSeconds: 15
    terminationGracePeriodSeconds: null
  service:
    router:
      type: ClusterIP
      port: 8080
    workloadManager:
      type: ClusterIP
      port: 8080
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  extraEnv: []

# ── Security posture ─────────────────────────────────────────────────────────
# READ THIS BEFORE DEPLOYING. The values shipped below are DEVELOPMENT defaults:
# authentication off and the egress proxy off. In that configuration a sandbox is
# an ordinary runc container with unrestricted outbound network access, and any
# caller that can reach the Router can create sandboxes and run code in them.
#
# The control plane refuses to start with `router.config.enableAuth: false`
# unless you also set `security.allowInsecureNoAuth: true`, so this cannot be
# reached silently. For anything beyond a throwaway cluster, see the
# "Production hardening" section of sandbox/README.md.
security:
  # Acknowledge running with authentication disabled. Development only.
  allowInsecureNoAuth: false

# ── Router (merged into controlplane; only config/extraEnv are consumed) ──────
router:
  config:
    maxConcurrentRequests: 1000
    # false leaves the Router and Workload Manager with NO auth middleware at
    # all — not a weaker check, none. Set true (plus safeApiUrl) in production.
    enableAuth: false
    safeApiUrl: ""                # required when enableAuth=true
    # Label selector (kubectl -l syntax) of the namespaces the Router and the
    # Workload Manager serve, e.g. "example.com/sandbox=enabled". A request for
    # a namespace that does not match gets 403 namespace_not_admitted (not 404,
    # which clients read as "sandbox gone"); a session is judged by the
    # namespace its sandbox lives in, not the one its URL names.
    # Empty serves every namespace (no Namespace informer, no extra RBAC); a
    # value of only whitespace is refused by the chart and the binary.
    # When set, the chart grants get/list/watch on namespaces, and the Router
    # reports not-ready until its namespace cache has synced.
    # Label every namespace clients use, including the implicit ones: a sandbox
    # created without a namespace goes to the release namespace, while a
    # template created without one goes to "default". If clients rely on
    # either default, label that namespace too, or their requests get 403.
    namespaceSelector: ""
  # Optional Ingress with ONE static Prefix path to the Router Service, so a
  # new workspace needs a namespace label rather than a new Ingress path.
  # It requires router.config.namespaceSelector: without one the prefix would
  # expose every namespace, and the chart refuses to render.
  # Annotations are passed through verbatim; put the gateway's source
  # allow-list and timeouts here -- they are controller-specific, so the chart
  # does not invent defaults for them.
  ingress:
    enabled: false
    name: agent-sandbox-router
    className: ""
    host: ""                      # empty = match any host
    path: /v1/namespaces/         # must start with /v1/namespaces/ (the chart refuses anything wider)
    annotations: {}
  extraEnv: []

# ── Workload Manager (merged into controlplane; only config/extraEnv are consumed) ──
workloadmanager:
  config:
    # Mirrors router.config.enableAuth (the control plane copies it at startup).
    enableAuth: false
    safeApiUrl: ""
    gcInterval: 15s
    defaultTTL: 24h
  extraEnv: []

# ── Egress (egress traffic control) ───────────────────────────────────────────
# EnvD embedded transparent proxy: iptables REDIRECT intercepts outbound TCP for SSRF protection + DNS rebinding defense.
# When enabled, Pod gets CAP_NET_ADMIN/CAP_NET_RAW (dropped after init).
#
# This proxy is the ONLY network control in the reference deployment: Flannel has
# no NetworkPolicy support, so with `enabled: false` there is nothing restricting
# a sandbox's outbound traffic — it can reach the cluster API, link-local
# metadata endpoints and the public internet. Enable it in production.
egress:
  enabled: false                    # true = enable transparent proxy + SSRF protection
  extraBlockedCIDRs: ""             # Extra blocked CIDRs (comma-separated) for ranges the built-in list does not cover, e.g. "203.0.113.0/24,198.51.100.0/24"

