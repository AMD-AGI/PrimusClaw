---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox-controlplane
  namespace: agent-sandbox-system
  labels:
    app: agent-sandbox-controlplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-sandbox-controlplane
  namespace: agent-sandbox-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-controlplane
  namespace: agent-sandbox-system
subjects:
  - kind: ServiceAccount
    name: agent-sandbox-controlplane
    namespace: agent-sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-sandbox-controlplane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox-controlplane
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxwarmpools", "sandboxtemplates"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims/status", "sandboxwarmpools/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["runtime.agent-sandbox.io"]
    resources: ["codeinterpreters"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["runtime.agent-sandbox.io"]
    resources: ["codeinterpreters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["runtime.agent-sandbox.io"]
    resources: ["clustersandboxpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-controlplane
subjects:
  - kind: ServiceAccount
    name: agent-sandbox-controlplane
    namespace: agent-sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-sandbox-controlplane
---
apiVersion: v1
kind: Service
metadata:
  name: agent-sandbox-router
  namespace: agent-sandbox-system
  labels:
    app: agent-sandbox-controlplane
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: router
      name: http
  selector:
    app: agent-sandbox-controlplane
---
apiVersion: v1
kind: Service
metadata:
  name: workloadmanager
  namespace: agent-sandbox-system
  labels:
    app: agent-sandbox-controlplane
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: wm
      name: http
  selector:
    app: agent-sandbox-controlplane
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox-controlplane
  namespace: agent-sandbox-system
  labels:
    app: agent-sandbox-controlplane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-sandbox-controlplane
  template:
    metadata:
      labels:
        app: agent-sandbox-controlplane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent-sandbox-controlplane
      tolerations:
        - operator: Exists
      # Spread replicas across distinct nodes for HA; soft rule so a single
      # eligible node does not leave replicas stuck Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: agent-sandbox-controlplane
                topologyKey: kubernetes.io/hostname
      containers:
        - name: controlplane
          # `latest` is republished by every non-release build, so IfNotPresent
          # would leave each node on whichever build it happened to cache first
          # and never pick up a new one. Pin to a published timestamp tag for a
          # reproducible deployment.
          image: primussafe/agent-sandbox-controlplane:latest
          imagePullPolicy: Always
          args:
            - --router-port=8080
            - --wm-port=8081
            - --metrics-bind-address=:8082
            - --health-probe-bind-address=:8083
            - --max-concurrent-requests=1000
            - --gc-interval=15s
            - --default-ttl=24h
            - --session-timeout=15m
            - --leader-elect=true
            - --extensions=true
            - --namespace=agent-sandbox-system
          env:
            - name: DOCKER_CONFIG
              value: /home/nonroot/.docker
            - name: AGENT_SANDBOX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_NODE_SELECTOR
              value: ""
            - name: SANDBOX_TOLERATIONS
              value: "[]"
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: agent-sandbox-redis
                  key: addr
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-sandbox-redis
                  key: password
            - name: SANDBOX_IMAGE_REGISTRY
              value: "harbor.example.com/agent-sandbox/"
            - name: REGISTRY_SECRET
              value: "registry-credentials"
            - name: ENVD_INJECTOR_IMAGE
              value: "primussafe/agent-sandbox-envd-injector:latest"
            - name: WORKLOAD_MANAGER_SERVICE_NAME
              value: "workloadmanager"
            - name: WORKLOAD_MANAGER_SERVICE_PORT
              value: "8080"
            - name: ENABLE_AUTH
              value: "__ENABLE_AUTH__"
            - name: SAFE_API_URL
              value: "__SAFE_API_URL__"
            # Required when ENABLE_AUTH=false. Render to "true" only for an
            # isolated development cluster; production must use SAFE_API_URL.
            - name: ALLOW_INSECURE_NO_AUTH
              value: "__ALLOW_INSECURE_NO_AUTH__"
            - name: INFERENCE_ENABLED
              value: "__INFERENCE_ENABLED__"
            - name: INFERENCE_LITELLM_ENDPOINT
              value: "__INFERENCE_LITELLM_ENDPOINT__"
            - name: EGRESS_ENABLED
              value: "__EGRESS_ENABLED__"
            - name: EGRESS_EXTRA_BLOCKED_CIDRS
              value: "__EGRESS_EXTRA_BLOCKED_CIDRS__"
            - name: AUDIT_ENABLED
              value: "true"
            - name: AUDIT_RETENTION_DAYS
              value: "30"
            # - name: SANDBOX_WATCH_INTERVAL
            #   value: "30s"
          ports:
            - containerPort: 8080
              name: router
            - containerPort: 8081
              name: wm
            - containerPort: 8082
              name: manager-metrics
            - containerPort: 8083
              name: manager-health
          # 30 * 2s = 60s. The router port stays closed until the JWT identity
          # is reconciled against the envd-router-identity Secret, so this has
          # to cover identityReconcileBudget (pkg/router/jwt.go, 30s) plus the
          # rest of startup. Shortening it kills the container mid-retry.
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          volumeMounts:
            - name: docker-config
              mountPath: /home/nonroot/.docker
              readOnly: true
      volumes:
        - name: docker-config
          secret:
            secretName: registry-credentials
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-sandbox-controlplane
  namespace: agent-sandbox-system
  labels:
    app: agent-sandbox-controlplane
spec:
  podSelector:
    matchLabels:
      app: agent-sandbox-controlplane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8082
