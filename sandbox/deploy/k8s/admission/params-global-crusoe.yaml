# Parameters of sandbox-pod-guardrails on global-crusoe (SaFE cluster "crusoe").
# GPU sandboxes in the SaFE workspaces crusoe-spur-vk, top-models,
# crusoe-amd-burst, crusoe-hyperloom-cicd, crusoe-hyperloom-dev and
# crusoe-hyperloom-crsdev use the workspace's hostpath volume /shared_nfs (it is
# the workspace volume, not a PVC). crusoe-amd-burst and crusoe-hyperloom-cicd
# replace crusoe-spur-vk and top-models; the old entries stay until no sandbox
# runs there.
# One key per namespace; the value is a comma-separated list of allowed roots.
# All six workspaces are external: every Pod in them runs on an Autopilot
# virtual-kubelet node, whose backend refuses a seccomp profile and any
# capability added or dropped, so virtual-kubelet.namespaces lists them and the
# policy does not require either there (see sandbox-pod-guardrails.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-pod-guardrails
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: agent-sandbox
data:
  crusoe-spur-vk: /shared_nfs
  top-models: /shared_nfs
  crusoe-amd-burst: /shared_nfs
  crusoe-hyperloom-cicd: /shared_nfs
  crusoe-hyperloom-dev: /shared_nfs
  crusoe-hyperloom-crsdev: /shared_nfs
  virtual-kubelet.namespaces: crusoe-spur-vk,top-models,crusoe-amd-burst,crusoe-hyperloom-cicd,crusoe-hyperloom-dev,crusoe-hyperloom-crsdev
---
# The binding of sandbox-pod-guardrails on this cluster (see sandbox-pod-guardrails.yaml).
# Warn only: violations are warnings, nothing is refused.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandbox-pod-guardrails
  labels:
    app.kubernetes.io/part-of: agent-sandbox
spec:
  policyName: sandbox-pod-guardrails
  paramRef:
    name: sandbox-pod-guardrails
    namespace: kube-system
    parameterNotFoundAction: Deny
  validationActions: [Audit, Warn]
