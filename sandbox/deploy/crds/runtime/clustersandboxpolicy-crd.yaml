---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clustersandboxpolicies.runtime.agent-sandbox.io
spec:
  group: runtime.agent-sandbox.io
  names:
    kind: ClusterSandboxPolicy
    listKind: ClusterSandboxPolicyList
    plural: clustersandboxpolicies
    singular: clustersandboxpolicy
    shortNames:
      - csp
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                preset:
                  type: string
                  description: Effective preset name, e.g. agent-default or agent-restricted. Defaults to metadata.name.
                mode:
                  type: string
                  enum:
                    - enforce
                    - audit
                allowedEgressHosts:
                  type: array
                  items:
                    type: string
                allowedInternalHosts:
                  type: array
                  items:
                    type: string
