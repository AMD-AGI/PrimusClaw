---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: codeinterpreters.runtime.agent-sandbox.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
spec:
  group: runtime.agent-sandbox.io
  names:
    kind: CodeInterpreter
    listKind: CodeInterpreterList
    plural: codeinterpreters
    singular: codeinterpreter
    shortNames: ["ci"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: ["template"]
              properties:
                template:
                  type: object
                  required: ["fromImage"]
                  properties:
                    fromImage:
                      description: Any Docker base image (e.g. python:3.11-slim). EnvD is injected via initContainer.
                      type: string
                    steps:
                      description: Initialization steps executed at Pod startup before EnvD starts (run/env/workdir).
                      type: array
                      items:
                        type: object
                        required: ["type", "args"]
                        properties:
                          type:
                            type: string
                            enum: [run, env, workdir]
                          args:
                            type: array
                            items:
                              type: string
                    sidecars:
                      description: Additional containers sharing the Pod network (e.g. Redis, MCP server).
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    runtimeClassName:
                      type: string
                    imagePullPolicy:
                      type: string
                      enum: [Always, Never, IfNotPresent]
                    imagePullSecrets:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                    environment:
                      type: array
                      items:
                        type: object
                        required: ["name"]
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                    resources:
                      type: object
                      properties:
                        limits:
                          type: object
                          additionalProperties:
                            x-kubernetes-int-or-string: true
                        requests:
                          type: object
                          additionalProperties:
                            x-kubernetes-int-or-string: true
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    volumes:
                      description: Extra volumes to attach to the sandbox Pod (e.g. hostPath, NFS, PVC).
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    volumeMounts:
                      description: >-
                        Extra volume mounts for the main container. When readOnly is omitted,
                        the mount defaults to read-only. Writable mounts must set readOnly
                        explicitly to false.
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          mountPath:
                            type: string
                          subPath:
                            type: string
                          readOnly:
                            type: boolean
                        required: ["name", "mountPath"]
                gpu:
                  type: object
                  properties:
                    product:
                      type: string
                    count:
                      type: integer
                      default: 1
                    resourceName:
                      type: string
                      default: "amd.com/gpu"
                    sharedMemory:
                      type: string
                sessionTimeout:
                  type: string
                  default: "15m"
                maxSessionDuration:
                  type: string
                  default: "24h"
                warmPoolSize:
                  type: integer
                  format: int32
                  minimum: 0
                authMode:
                  type: string
                  enum: [envd, none]
                  default: envd
                ports:
                  type: array
                  items:
                    type: object
                    required: ["port", "protocol"]
                    properties:
                      name:
                        type: string
                      port:
                        type: integer
                      pathPrefix:
                        type: string
                      protocol:
                        type: string
                        enum: [HTTP, HTTPS]
                        default: HTTP
                runtimePolicy:
                  description: "Name of ClusterSandboxPolicy. Defaults to agent-default."
                  type: string
                  enum: [agent-default, agent-restricted]
                  default: agent-default
                allowedEgressHosts:
                  description: "External domain whitelist (agent-restricted mode only)."
                  type: array
                  items:
                    type: string
                allowedInternalHosts:
                  description: "Internal IP/CIDR whitelist (bypasses SSRF blocking). CIDR mask >= /16."
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status", "reason", "message", "lastTransitionTime"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
