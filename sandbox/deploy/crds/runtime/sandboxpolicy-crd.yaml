---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxpolicies.runtime.agent-sandbox.io
spec:
  group: runtime.agent-sandbox.io
  names:
    kind: SandboxPolicy
    listKind: SandboxPolicyList
    plural: sandboxpolicies
    singular: sandboxpolicy
    shortNames:
      - sbp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Policy
          type: string
          jsonPath: .spec.runtimePolicy
        - name: Mode
          type: string
          jsonPath: .spec.policyMode
        - name: Version
          type: integer
          jsonPath: .spec.policyVersion
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >
            Authoritative egress policy for one Sandbox. Owned by the control
            plane; name/namespace match the Sandbox. Do not treat Sandbox
            annotations as policy authority.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                runtimePolicy:
                  type: string
                  default: agent-default
                policyMode:
                  type: string
                  enum: [enforce, audit]
                  default: enforce
                allowedEgressHosts:
                  type: array
                  items:
                    type: string
                allowedInternalHosts:
                  type: array
                  items:
                    type: string
                policyVersion:
                  type: integer
                  format: int64
                  default: 1
