# Copyright Advanced Micro Devices, Inc.
# SPDX-License-Identifier: MIT

version = 1
SPDX-PackageName = "PrimusClaw"
SPDX-PackageSupplier = "Advanced Micro Devices, Inc."
SPDX-PackageDownloadLocation = "https://github.com/AMD-AGI/PrimusClaw"

# The repository is MIT-licensed (see the root LICENSE file). This default
# annotation makes every file REUSE-compliant without per-file headers.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Advanced Micro Devices, Inc."
SPDX-License-Identifier = "MIT"

# The sandbox/ directory is a FORK of the upstream sigs.k8s.io/agent-sandbox
# project (not an unmodified vendored copy), licensed under Apache-2.0. This more
# specific annotation comes last so it overrides the repo-wide MIT default and
# keeps the correct upstream license for these files.
#
# Copyright is genuinely shared here: large parts are upstream (api/, controllers/,
# extensions/, client-go/, test/) while others are AMD-authored and released under
# the same Apache-2.0 terms (see sandbox/UPSTREAM.md for the split). Both holders
# are listed rather than attributing the whole tree to one of them; the per-file
# SPDX headers remain authoritative for any individual file.
[[annotations]]
path = "sandbox/**"
precedence = "override"
SPDX-FileCopyrightText = ["The Kubernetes Authors", "Advanced Micro Devices, Inc."]
SPDX-License-Identifier = "Apache-2.0"

# `goDurationNs` in the file below is a close port of `time.ParseDuration` from
# the Go standard library -- deliberately so, because the Workload Manager it
# has to agree with is Go, and a parser that only resembles that one disagrees
# with it in silence. The bounds, the overflow guards, the uint64 arithmetic and
# the leadingInt/leadingFraction structure are all taken from the original, so
# the file carries the Go Authors' copyright and BSD-3-Clause alongside the
# repository's own MIT. The rest of the file is AMD-authored under MIT; the
# comment above the function marks where the ported part starts and ends.
[[annotations]]
path = "claw/packages/brain/src/config.ts"
precedence = "override"
SPDX-FileCopyrightText = ["Advanced Micro Devices, Inc.", "The Go Authors"]
SPDX-License-Identifier = "MIT AND BSD-3-Clause"

# The Fernet specification's test vectors, as pyca/cryptography redistributes them (vectors/cryptography_vectors/fernet),
# copied unchanged so the TypeScript Fernet is checked against the same tokens as Python's.
[[annotations]]
path = "personal-agent/test-support/data/fernet-spec/**"
precedence = "override"
SPDX-FileCopyrightText = "Individual contributors to cryptography"
SPDX-License-Identifier = "Apache-2.0 OR BSD-3-Clause"

# The Adaptive Card 1.5 JSON schema, as Microsoft publishes it (adaptivecards.io, from the MIT-licensed
# microsoft/AdaptiveCards repository), copied unchanged so every card the personal agent sends is validated against it.
[[annotations]]
path = "personal-agent/test-support/data/adaptive-card-1.5.schema.json"
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "MIT"
