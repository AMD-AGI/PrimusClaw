# Vulnerabilities the base-image gate is allowed to see and still pass.
#
# Read `.github/workflows/security.yml` first: the gate scans the *upstream*
# base image of each Dockerfile's final stage, not the image we build from it.
# So nothing this repository can write -- an `apt-get upgrade`, an extra layer,
# a rebuild -- changes what that scan reports. The only lever is the digest pin,
# and it only helps once upstream has published an image carrying the fix.
#
# An entry here therefore means exactly one thing: Debian has shipped the fix,
# the image publisher has not rebuilt yet, and there is no action available in
# this repository until they do. Anything else -- a vulnerability in a package
# we install, in a dependency we pin, or one with no fix at all (which
# `--ignore-unfixed` already drops) -- does not belong in this file.
#
# Every entry carries `expired_at`. Trivy stops honouring the entry from that
# date, so the gate turns red again on its own and someone has to look: either
# upstream has rebuilt and the entry is deleted, or it has not and the date is
# pushed out deliberately, in a commit, with the reason updated. An exemption
# that cannot expire is how a scan quietly stops being a scan.

# Empty, and that is the state to keep it in. The two libpcre2 entries that
# stood here were exactly what the rule above describes -- Debian had shipped
# 10.42-1+deb12u1 and the image publishers had not rebuilt. On 2026-09-21 both
# had, so the pins moved to the rebuilt digests (node:26-bookworm-slim
# sha256:582460f6..., python:3.14-slim-bookworm sha256:82bc3c53...) and the
# exemptions were deleted rather than renewed.
#
# Verified by reading `var/lib/dpkg/status` out of the published layer, not by
# trusting the rebuild date -- the note being replaced here records that bumping
# the pins had already been tried once and did NOT close these, so a new digest
# is not by itself evidence of a new package. Both images now carry
# libpcre2-8-0 10.42-1+deb12u1.
#
# The rebuild also closes CVE-2026-89157, the third of the same batch, which was
# failing the gate with no entry here at all.
#
# 2026-10-12: perl-base in node:26-bookworm-slim. Debian published
# 5.36.0-7+deb12u4 for these; the newest node:26-bookworm-slim digest (checked
# the same day) still carries deb12u3, so no pin bump helps. claw/Dockerfile
# installs perl-base in the runtime stage, so the shipped image does get the
# fixed package; only the upstream-image scan stays red. Expires 2026-10-19:
# delete the entries once node rebuilds, or re-justify in a commit.
vulnerabilities:
  - id: CVE-2026-13221
    expired_at: 2026-10-19
    statement: "Fixed in perl-base 5.36.0-7+deb12u4; node:26-bookworm-slim not yet rebuilt."
  - id: CVE-2026-42496
