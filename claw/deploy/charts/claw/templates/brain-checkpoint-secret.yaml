{{- /*
The key that seals v4 checkpoints. Brain's Secret, and only Brain's.

Not a key in primus-claw-secrets: that Secret is pulled in whole with envFrom
by the API and, when enabled, by the workspace-reaper CronJob. The reaper's job
is to delete directories; handing it the ability to decrypt a conversation
because it happens to share a Secret is the same mistake that made every
component able to write every KV bucket.

Not derived from USER_ENV_ENCRYPTION_KEY either, tempting as it is to avoid a
second key. Reading a checkpoint for debugging would then require the user-env
vault master key, whose entire point is that not even the API returns its
plaintext.

Rotation is not a rolling operation. The bucket's max_age is 24h, so a run
checkpointed under the old key and resumed under the new one cannot be opened
and restarts from turn zero. Rotate by draining: stop writing v4, wait out the
TTL, swap, resume. Changing this Secret also rolls every Brain pod via the
checksum annotation on the Deployment, which is precisely when in-flight runs
are being redelivered.
*/ -}}
{{- if .Values.secret.brainCheckpointKey }}
apiVersion: v1
kind: Secret
metadata:
  name: primus-claw-brain-checkpoint
  labels:
    {{- include "primus-claw.labels" . | nindent 4 }}
    component: primus-claw-brain
type: Opaque
stringData:
  BRAIN_CHECKPOINT_KEY: {{ .Values.secret.brainCheckpointKey | quote }}
{{- end }}
