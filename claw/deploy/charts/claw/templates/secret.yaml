{{- if .Values.secret.create }}
{{- /*
  Brain resolves sandboxes through one of two mutually exclusive providers
  (see packages/brain/src/sandbox/ensure-hands.ts): SafeWorkloadProvider in
  safe mode reads SANDBOX_*, AgentSandboxProvider in kubernetes mode reads
  AGENT_SANDBOX_*. Both name the same router and the same workspace, so they
  are rendered from one pair of values -- a second pair would only let an
  operator set them inconsistently. In kubernetes mode an empty router URL is
  fatal at the first message, so fail here instead.
*/ -}}
{{- $k8sMode := eq (.Values.secret.clawDeployMode | default "") "kubernetes" }}
{{- $sandboxRouterUrl := .Values.secret.sandboxRouterUrl }}
{{- $sandboxNamespace := .Values.secret.sandboxNamespace }}
{{- if $k8sMode }}
{{-   $sandboxRouterUrl = required "secret.sandboxRouterUrl is required when secret.clawDeployMode=kubernetes (Brain reads it as AGENT_SANDBOX_ROUTER_URL)" $sandboxRouterUrl }}
{{-   $sandboxNamespace = required "secret.sandboxNamespace is required when secret.clawDeployMode=kubernetes (Brain reads it as AGENT_SANDBOX_NAMESPACE)" $sandboxNamespace }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: primus-claw-secrets
  labels:
    {{- include "primus-claw.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_INTERNAL_TOKEN: {{ required "secret.authInternalToken is required" .Values.secret.authInternalToken | quote }}
  USER_ENV_ENCRYPTION_KEY: {{ required "secret.userEnvEncryptionKey is required" .Values.secret.userEnvEncryptionKey | quote }}
  NATS_URL: {{ default (printf "nats://primus-claw-nats.%s.svc.cluster.local:4222" .Release.Namespace) .Values.secret.natsUrl | quote }}
  NATS_USER: {{ .Values.secret.natsUser | quote }}
  NATS_PASSWORD: {{ .Values.secret.natsPassword | quote }}
  NATS_REPLICAS: {{ .Values.secret.natsReplicas | quote }}
  CLAW_DEPLOY_MODE: {{ .Values.secret.clawDeployMode | quote }}
  SANDBOX_ROUTER_URL: {{ $sandboxRouterUrl | quote }}
  SANDBOX_NAMESPACE: {{ $sandboxNamespace | quote }}
  AGENT_SANDBOX_ROUTER_URL: {{ $sandboxRouterUrl | quote }}
  AGENT_SANDBOX_NAMESPACE: {{ $sandboxNamespace | quote }}
  CLAW_DEPLOY_ROOT: {{ .Values.secret.clawDeployRoot | quote }}
  WORKSPACE_PERSIST_BASE: {{ .Values.secret.workspacePersistBase | quote }}
  LITELLM_API_BASE: {{ .Values.secret.litellmApiBase | quote }}
  SAFE_DEFAULT_WORKSPACE: {{ .Values.secret.safeDefaultWorkspace | quote }}
  SANDBOX_WORKLOAD_PRIORITY: {{ .Values.secret.sandboxWorkloadPriority | quote }}
  SANDBOX_DEFAULT_TIMEOUT_SECONDS: {{ .Values.secret.sandboxDefaultTimeoutSeconds | quote }}
  SANDBOX_PENDING_TIMEOUT_SECONDS: {{ .Values.secret.sandboxPendingTimeoutSeconds | quote }}
  MULTI_NODE_DEFAULT_TIMEOUT_SECONDS: {{ .Values.secret.multiNodeDefaultTimeoutSeconds | quote }}
  LLM_API_STYLE: {{ required "secret.llmApiStyle is required" .Values.secret.llmApiStyle | quote }}
  PROMPT_CACHE_ENABLED: {{ .Values.secret.promptCacheEnabled | quote }}
  LLM_CACHE_TTL: {{ .Values.secret.llmCacheTtl | quote }}
  LLM_CACHE_STYLE: {{ .Values.secret.llmCacheStyle | quote }}
  ANTHROPIC_BASE_URL: {{ required "secret.anthropicBaseUrl is required" .Values.secret.anthropicBaseUrl | quote }}
  DEFAULT_MODEL: {{ .Values.secret.defaultModel | quote }}
  OPENAI_BASE_URL: {{ required "secret.openaiBaseUrl is required" .Values.secret.openaiBaseUrl | quote }}
  BYOK_VERIFY_MODELS_URL: {{ .Values.secret.byokVerifyModelsUrl | quote }}
  BYOK_VERIFY_API_STYLE: {{ required "secret.byokVerifyApiStyle is required" .Values.secret.byokVerifyApiStyle | quote }}
  CURSOR_API_KEY: {{ .Values.secret.cursorApiKey | quote }}
  S3_ENDPOINT: {{ required "secret.s3Endpoint is required" .Values.secret.s3Endpoint | quote }}
  S3_API_ENDPOINT: {{ required "secret.s3ApiEndpoint is required" .Values.secret.s3ApiEndpoint | quote }}
  S3_BUCKET: {{ .Values.secret.s3Bucket | quote }}
  S3_REGION: {{ .Values.secret.s3Region | quote }}
  S3_ACCESS_KEY: {{ required "secret.s3AccessKey is required" .Values.secret.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ required "secret.s3SecretKey is required" .Values.secret.s3SecretKey | quote }}
  DEFAULT_SANDBOX_IMAGE: {{ .Values.defaultSandbox.image | quote }}
  DEFAULT_SANDBOX_CPU: {{ .Values.defaultSandbox.cpu | quote }}
  DEFAULT_SANDBOX_MEMORY: {{ .Values.defaultSandbox.memory | quote }}
  MAX_CONCURRENT: {{ .Values.brain.maxConcurrent | quote }}
  MAX_RESIDENT: {{ .Values.brain.maxResident | quote }}
  RUN_GATE_KEY: {{ .Values.brain.runGateKey | quote }}
  # How long files survive after nothing references them. Deliberately the
  # same number the collector counts with: the API writes the deadline onto
  # the workspace row and the collector honours it, so two different values
  # would mean the row's stated deadline was not the one being enforced.
  WORKSPACE_RETENTION_DAYS: {{ .Values.reaper.retentionDays | quote }}
  # Both read by the API's sweeper rather than the collector, and separate
  # because they do different things to a user: the first reclaims a reference
  # a failed teardown left on a session whose objects are already deleted, the
  # second releases the reference of a session that still exists and so starts
  # the countdown that removes that user's files. Zero disables either.
  WORKSPACE_DELETED_RELEASE_DAYS: {{ .Values.reaper.deletedReleaseDays | quote }}
  WORKSPACE_IDLE_RELEASE_DAYS: {{ .Values.reaper.idleReleaseDays | quote }}
  # How many times a queued message may be refused a workspace before it is
  # abandoned with a failed run row. Each refusal comes back through the event
  # consumer's ten-second nak, so this is roughly the minute the DAG path allows
  # itself for the same refusal.
  PENDING_DISPATCH_BIND_MAX_ATTEMPTS: {{ .Values.api.pendingDispatchBindMaxAttempts | quote }}
  # Rendered only when set, so an unset value leaves the env var absent and the
  # code default in charge. The guard tests nil and "" separately rather than
  # piping through `default`, because `default` -- and `with`, and `empty` --
  # all treat 0 as absent, and 0 is the one value that has to survive: it is the
  # off switch.
  #
  # `kindIs "invalid"` is the nil half. `toString nil` is "<nil>", not "", so an
  # explicit `runBudgetChatSec: null` passed the "" test and emitted the key
  # anyway, with `quote` rendering nil as an empty value. An empty env var is
  # what `readIntSetting` returns null for, which `envInt` answers with the very
  # default the operator was overriding -- and unlike a refused value, an unset
  # one records no settings problem, so that fallback is silent in the full
  # sense. Omitting the key reaches the same default and says so honestly.
  {{- if and (not (kindIs "invalid" .Values.api.runBudgetChatSec)) (ne (toString .Values.api.runBudgetChatSec) "") }}
  RUN_BUDGET_CHAT_SEC: {{ .Values.api.runBudgetChatSec | quote }}
  {{- end }}
  {{- if and (not (kindIs "invalid" .Values.api.runBudgetDagNodeSec)) (ne (toString .Values.api.runBudgetDagNodeSec) "") }}
  RUN_BUDGET_DAG_NODE_SEC: {{ .Values.api.runBudgetDagNodeSec | quote }}
  {{- end }}
  RUN_DOORBELL_DISPATCH: {{ .Values.features.runDoorbellDispatch | default false | quote }}
  ADMIT_SOFT_RUNS: {{ .Values.api.admitSoftRuns | default 0 | quote }}
  ADMIT_HARD_RUNS: {{ .Values.api.admitHardRuns | default 0 | quote }}
  ADMIT_SOFT_SANDBOXES: {{ .Values.api.admitSoftSandboxes | default 0 | quote }}
  ADMIT_HARD_SANDBOXES: {{ .Values.api.admitHardSandboxes | default 0 | quote }}
  ADMIT_SOFT_GPU_NODES: {{ .Values.api.admitSoftGpuNodes | default 0 | quote }}
  ADMIT_HARD_GPU_NODES: {{ .Values.api.admitHardGpuNodes | default 0 | quote }}
  ADMIT_TREE_MAX_NODES: {{ .Values.api.admitTreeMaxNodes | default 0 | quote }}
  ADMIT_TREE_MAX_DEPTH: {{ .Values.api.admitTreeMaxDepth | default 0 | quote }}
  TASK_MAX_DELIVER: {{ .Values.brain.taskMaxDeliver | quote }}
  TASK_MAX_ACK_PENDING: {{ .Values.brain.taskMaxAckPending | quote }}
  FETCH_HEADERS_TIMEOUT_MS: {{ .Values.secret.fetchHeadersTimeoutMs | quote }}
  FETCH_BODY_IDLE_TIMEOUT_MS: {{ .Values.secret.fetchBodyIdleTimeoutMs | quote }}
  SANDBOX_KEEPALIVE_FAIL_LIMIT: {{ .Values.secret.sandboxKeepaliveFailLimit | quote }}
  API_PORT: {{ .Values.api.port | quote }}
  CORS_ORIGINS: {{ .Values.api.corsOrigins | default "" | quote }}
  EXECUTOR_HOST: "0.0.0.0"
  EXECUTOR_PORT: {{ .Values.brain.port | quote }}
{{- end }}