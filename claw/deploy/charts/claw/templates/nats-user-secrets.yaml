{{- /*
One NATS credential per workload, each in its own Secret.

Why separate Secrets rather than more keys in primus-claw-secrets: every
workload mounts that Secret with `envFrom`, which injects all of its keys. Add
BRAIN_NATS_PASSWORD to it and the API process has brain's credential in its
environment -- which is precisely the separation this exists to create. A
Secret per workload is the only shape where a component cannot read a
credential it was not given.

Rendered only for the components whose password is set. That gate is what makes
this chart safe to roll out ahead of the NATS side: with no passwords
configured nothing here renders, the Deployments fall back to the shared
NATS_USER / NATS_PASSWORD from primus-claw-secrets, and the release behaves
exactly as it did before. Configure the passwords once nats-values.yaml has the
matching users, and each workload switches to its own identity.

The corresponding permission allow-lists live in deploy/nats-values.yaml. The
two files have to move together: a workload pointed at a user that does not
exist yet cannot authenticate at all, and a user whose allow-list is missing a
subject fails silently instead -- see the notes in that file.

The body of one Secret lives in the `primus-claw.natsUserSecret` helper so that
each Deployment can hash its OWN workload's credential into a checksum
annotation. Hashing this whole file instead would roll every workload whenever
any one credential was rotated, which turns a single-component rotation into a
fleet-wide restart.
*/ -}}
{{- $root := . }}
{{- /* `ops` has no workload; its Secret exists so upgrade.sh can read a
       credential scoped to the drain gate instead of borrowing api's. */ -}}
{{- range $component := list "api" "brain" "reaper" "ops" }}
{{- $body := include "primus-claw.natsUserSecret" (dict "root" $root "component" $component) }}
{{- if $body }}
---
{{ $body }}
{{- end }}
{{- end }}
