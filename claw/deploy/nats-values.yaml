# NATS Helm values for Claw (primus-claw namespace).
# Chart version: nats-2.12.6.
#
# This file is a template — do NOT feed it to `helm` directly. Both
# deploy.sh and deploy/scripts/make-dev-account.sh render it by:
#   (1) replacing __PROD_NATS_PASSWORD__ / __SYS_NATS_PASSWORD__ with
#       values from the operator's credentials file (default
#       $HOME/.nats-claw-creds.env, gitignored).
#   (2) replacing the {{DEV_ACCOUNTS}} placeholder with one block per
#       DEV_<NAME> entry found in the same credentials file.
#
# Multi-account isolation:
#   - PROD account hosts the production api/brain deployment. A dispatch control
#     plane above Claw publishes into it as a second, publish-only user; it is
#     not an account of its own because its stream lives in PROD's JetStream
#     namespace and an account boundary is exactly what a separate account
#     would put between them.
#   - DEV_<NAME> accounts host individual developers' local instances.
#   - Each account has its own JetStream namespace, so prod and devs can
#     reuse the same subject names (events.>, tasks.>) without collision.

container:
  image:
    repository: nats
    tag: 2.12.6-alpine

reloader:
  image:
    repository: natsio/nats-server-config-reloader
    tag: 0.21.1

# storageClassName is injected at deploy time via:
#   --set config.jetstream.fileStore.pvc.storageClassName=$STORAGE_CLASS
config:
  cluster:
    enabled: true
    replicas: 3
    name: nats
  jetstream:
    enabled: true
    fileStore:
      pvc:
        size: 100Gi

  merge:
    accounts:
      PROD:
        jetstream: enabled
        users:
          - user: prod
            password: "__PROD_NATS_PASSWORD__"
          # The dispatch control plane above Claw. Publishes its terminal
          # events and nothing else: it does not read Claw's streams, and a
          # credential that could would make every future Claw subject readable
          # by another service by default.
          #
          # The subject is rendered from DISPATCH_SUBJECT_PREFIX so it cannot
          # drift from the stream the API provisions under the same setting --
          # a permission for one prefix and a stream for another is a publisher
          # that authenticates and then has nowhere to publish.
          #
          # `_INBOX.>` is not an exception to publish-only -- a JetStream
          # publish waits for its ack on an inbox, so without it every publish
          # times out while still succeeding server-side, which is the worst of
          # both.
          - user: dispatch
            password: "__DISPATCH_NATS_PASSWORD__"
            permissions:
              publish:
                allow:
                  - "__DISPATCH_SUBJECT_PREFIX__.>"
              subscribe:
                allow:
                  - "_INBOX.>"
      # {{DEV_ACCOUNTS}}
      SYS:
        users:
          - user: sys
            password: "__SYS_NATS_PASSWORD__"
    system_account: SYS
