#
# The rollout gates of claw/docs/doorbell-rollout.md, evaluated by the PromQL
# engine rather than by a reader. Every expression here is the published one
# with $ns, $N and $w substituted, and each is asserted under both documented
# selector variants against the labels that scrape mode produces: variant A
# over ServiceMonitor series carrying pod and the Service-name service label,
# variant B over annotation-mode series carrying neither.
#
# Three PromQL properties make a gate fail silently, and every case below is
# shaped by them: a bare comparison filters rather than answering, so each gate
# ends in `bool`; sum and count over no series return an empty vector rather
# than 0, so each closes with `or vector(0)`; and min/max cannot see a replica
# that is not reporting, so fleet completeness is its own gate.
#
#   run with: promtool test rules claw/deploy/promql/rollout-gates.test.yaml
#
# $ns = primus-claw, $N = 2, $w = 5m.

tests:
  - name: "precheck and the rolled-back state: Doorbell off, nothing enabled"
    # The reading §8.2 R6 declares a rollback complete on, and the P1 shape a
    # precheck must show before any flip. Every dimension series exists on every
    # replica before anything is enabled, which is what lets the count gates run.
