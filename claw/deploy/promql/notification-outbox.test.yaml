#
# The alerts of notification-outbox.rules.yaml against the PromQL engine: each fires once on the shape it is for, across
# two replicas reporting the same table, and is gone when that shape clears.
#
#   run with: promtool test rules claw/deploy/promql/notification-outbox.test.yaml

rule_files:
  - notification-outbox.rules.yaml

evaluation_interval: 1m

tests:
  - name: "a stall fires one alert after 15 minutes plus 5, and clears when the backlog is delivered"
    interval: 1m
    input_series:
      # Both replicas read the same table. Healthy for 10 minutes, then a row waits and ages one minute a minute for
      # 30 minutes, then everything is delivered.
      - series: 'claw_notification_outbox_oldest_pending_age_seconds{namespace="primus-claw", pod="claw-api-1"}'
        values: '0x9 0+60x29 0x20'
      - series: 'claw_notification_outbox_oldest_pending_age_seconds{namespace="primus-claw", pod="claw-api-2"}'
        values: '0x9 0+60x29 0x20'
    alert_rule_test:
      # 10 minutes in: nothing waits.
      - eval_time: 10m
        alertname: ClawNotificationOutboxStalled
        exp_alerts: []
      # 25 minutes in: the row has waited 900 s, not more: not yet.
      - eval_time: 25m
        alertname: ClawNotificationOutboxStalled
        exp_alerts: []
      # 28 minutes in: past 900 s for 2 minutes, pending for "for".
      - eval_time: 28m
        alertname: ClawNotificationOutboxStalled
        exp_alerts: []
      # 32 minutes in: past 900 s for more than 5 minutes: one alert, not one per replica.
      - eval_time: 32m
        alertname: ClawNotificationOutboxStalled
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Claw notifications are not being delivered"
              description: >-
                The oldest notification still to be delivered has waited 22m 0s. Check the
                receiver of the failing subscription (claw_notification_subscriptions_failing,
                claw_notification_subscription_failures_max) and claw-api's "notification." log lines.
      # 41 minutes in: delivered: resolved.
      - eval_time: 41m
        alertname: ClawNotificationOutboxStalled
        exp_alerts: []

  - name: "a quarantined notification fires one warning, which clears an hour later"
    interval: 1m
    input_series:
      - series: 'claw_notification_quarantined_total{namespace="primus-claw", pod="claw-api-1", reason="isolated_failures"}'
        values: '0x10 1x100'
      - series: 'claw_notification_quarantined_total{namespace="primus-claw", pod="claw-api-2", reason="isolated_failures"}'
        values: '0x110'
    alert_rule_test:
      - eval_time: 5m
        alertname: ClawNotificationQuarantined
        exp_alerts: []
      - eval_time: 15m
        alertname: ClawNotificationQuarantined
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A Claw notification was quarantined"
              description: >-
                At least one notification was quarantined in the last hour. Look for "notification.quarantined" in claw-api's
                log for the event and the receiver's answer, and at the receiver's log for why it cannot take it.
      # Still within the hour: still firing, so it is not missed between two looks.
      - eval_time: 50m
        alertname: ClawNotificationQuarantined
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A Claw notification was quarantined"
              description: >-
                At least one notification was quarantined in the last hour. Look for "notification.quarantined" in claw-api's
                log for the event and the receiver's answer, and at the receiver's log for why it cannot take it.
      - eval_time: 80m
        alertname: ClawNotificationQuarantined
        exp_alerts: []

  # The shape claw-api's start-up initialisation exists for, checked here in case a series still arrives this way: a
  # replica Prometheus first sees with the counter already at 1. increase() over it is 0; the alert must fire anyway, once,
  # and clear an hour after the series appeared.
  - name: "a counter first seen at 1 still fires the warning, and clears an hour later"
    interval: 1m
    input_series:
      - series: 'claw_notification_quarantined_total{namespace="primus-claw", pod="claw-api-1", reason="isolated_failures"}'
        values: '0x110'
      - series: 'claw_notification_quarantined_total{namespace="primus-claw", pod="claw-api-3", reason="isolated_failures"}'
        values: '_x10 1x100'
    alert_rule_test:
      - eval_time: 5m
        alertname: ClawNotificationQuarantined
        exp_alerts: []
      - eval_time: 15m
        alertname: ClawNotificationQuarantined
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A Claw notification was quarantined"
              description: >-
                At least one notification was quarantined in the last hour. Look for "notification.quarantined" in claw-api's
                log for the event and the receiver's answer, and at the receiver's log for why it cannot take it.
      - eval_time: 65m
        alertname: ClawNotificationQuarantined
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "A Claw notification was quarantined"
              description: >-
                At least one notification was quarantined in the last hour. Look for "notification.quarantined" in claw-api's
                log for the event and the receiver's answer, and at the receiver's log for why it cannot take it.
      - eval_time: 75m
        alertname: ClawNotificationQuarantined
        exp_alerts: []

  # A replica that restarts exports its counter at 0 again: a new series at 0 is not a quarantine.
  - name: "a replica that starts with the counter at 0 fires nothing"
    interval: 1m
    input_series:
      - series: 'claw_notification_quarantined_total{namespace="primus-claw", pod="claw-api-1", reason="isolated_failures"}'
        values: '0x30'
      - series: 'claw_notification_quarantined_total{namespace="primus-claw", pod="claw-api-4", reason="isolated_failures"}'
        values: '_x10 0x100'
    alert_rule_test:
      - eval_time: 5m
        alertname: ClawNotificationQuarantined
        exp_alerts: []
      - eval_time: 15m
        alertname: ClawNotificationQuarantined
        exp_alerts: []
      - eval_time: 80m
        alertname: ClawNotificationQuarantined
        exp_alerts: []
